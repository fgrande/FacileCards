oke="#9AA5B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="476" font-size="12.5" font-weight="400" fill="#9AA5B8" text-anchor="start" opacity="1">È quella del telefono. Puoi cambiarla.</text><rect x="16" y="500" width="358" height="122" rx="12" fill="#1A2029" stroke="#323A48" stroke-width="1" opacity="1"/><text x="30" y="532" font-size="16" font-weight="600" fill="#E8ECF3" text-anchor="start" opacity="1">Avvisami delle scadenze</text><text x="30" y="553" font-size="12.5" font-weight="400" fill="#9AA5B8" text-anchor="start" opacity="1">Per le tessere che hanno una data di scadenza</text><rect x="312" y="516" width="48" height="28" rx="14" fill="#4C87F2" opacity="1"/><circle cx="346" cy="530" r="10" fill="#fff"/><line x1="30" y1="572" x2="360" y2="572" stroke="#262D39" stroke-width="1" stroke-linecap="round"/><text x="30" y="601" font-size="15" font-weight="500" fill="#E8ECF3" text-anchor="start" opacity="1">Giorni di preavviso</text><rect x="262" y="582" width="98" height="30" rx="15" fill="#0F131A" stroke="#323A48" stroke-width="1" opacity="1"/><text x="278" y="602" font-size="16" font-weight="600" fill="#9AA5B8" text-anchor="start" opacity="1">–</text><text x="311" y="602" font-size="15" font-weight="600" fill="#E8ECF3" text-anchor="middle" opacity="1">30</text><text x="338" y="602" font-size="16" font-weight="600" fill="#9AA5B8" text-anchor="start" opacity="1">+</text><text x="195" y="660" font-size="13" font-weight="400" fill="#9AA5B8" text-anchor="middle" opacity="1">Potrai cambiare tutto dalle impostazioni.</text><rect x="16" y="756" width="358" height="50" rx="25.0" fill="#4C87F2" opacity="1"/><text x="195.0" y="786.5" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" opacity="1">Inizia</text><text x="24" y="31" font-size="15" font-weight="600" fill="#E8ECF3" text-anchor="start" opacity="1">9:41</text><g fill="#E8ECF3"><rect x="318" y="20" width="3" height="5" rx="1"/><rect x="323" y="17" width="3" height="