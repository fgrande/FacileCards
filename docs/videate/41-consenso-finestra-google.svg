<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="Roboto, Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><defs><clipPath id="s"><rect width="390" height="844" rx="38"/></clipPath></defs><g clip-path="url(#s)"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F4F6FB" opacity="1"/><g transform="translate(119 120) scale(2.1)"><g transform="translate(18 52) scale(.092)"><rect width="400" height="250" rx="40" fill="#1F5FD6" transform="rotate(-8 200 125)"/></g><g transform="translate(34 57) scale(.105)" fill="#fff"><rect x="6" y="62" width="26" height="70" rx="7"/><g transform="rotate(14 66 62)"><rect x="50" y="4" width="32" height="74" rx="16"/></g><rect x="40" y="56" width="88" height="76" rx="14"/></g></g><text x="195" y="330" font-size="24" font-weight="700" fill="#161B26" text-anchor="middle" opacity="1">FacileCards è gratuita</text><text x="195" y="360" font-size="24" font-weight="700" fill="#161B26" text-anchor="middle" opacity="1">grazie agli annunci</text><text x="195" y="406" font-size="15" font-weight="400" fill="#5F6B80" text-anchor="middle" opacity="1">Ti chiediamo come vuoi che vengano mostrati.</text><rect x="35" y="440" width="320" height="50" rx="6" fill="#ECEFF5" stroke="#D5DBE7" stroke-width="1" opacity="1"/><text x="46" y="457" font-size="10" font-weight="600" fill="#5F6B80" text-anchor="start" opacity="1">Annuncio</text><rect x="46" y="465" width="150" height="8" rx="4" fill="#D5DBE7" opacity="1"/><rect x="46" y="477" width="96" height="6" rx="3" fill="#DFE4EC" opacity="1"/><rect x="275" y="453" width="66" height="24" rx="12" fill="#D5DBE7" opacity="1"/><rect x="24" y="520" width="342" height="78" rx="14" fill="#DCE7FF" opacity="1"/><text x="40" y="548" font-size="14" font-weight="500" fill="#0B2A66" text-anchor="start" opacity="1">Se non acconsenti, vedrai comunque annunci,</text><text x="40" y="570" font-size="14" font-weight="500" fill="#0B2A66" text-anchor="start" opacity="1">ma non personalizzati.</text><text x="40" y="590" font-size="1" font-weight="400" fill="#161B26" text-anchor="start" opacity="1"></text><text x="195" y="640" font-size="13" font-weight="400" fill="#5F6B80" text-anchor="middle" opacity="1">Potrai cambiare scelta in qualsiasi momento</text><text x="195" y="660" font-size="13" font-weight="400" fill="#5F6B80" text-anchor="middle" opacity="1">dalle Impostazioni.</text><rect x="24" y="736" width="342" height="50" rx="25.0" fill="#1F5FD6" opacity="1"/><text x="195.0" y="766.5" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" opacity="1">Continua</text><rect x="0" y="0" width="390" height="844" rx="0" fill="#0B1220" opacity="0.5"/><rect x="0" y="250" width="390" height="610" rx="28" fill="#FFFFFF" opacity="1"/><rect x="171" y="262" width="48" height="5" rx="2.5" fill="#C9D0DC" opacity="1"/><rect x="24" y="284" width="168" height="24" rx="12" fill="#EEF1F6" opacity="1"/><text x="108" y="301" font-size="11.5" font-weight="600" fill="#5F6B80" text-anchor="middle" opacity="1">Finestra di Google</text><text x="24" y="346" font-size="20" font-weight="700" fill="#161B26" text-anchor="start" opacity="1">Annunci e dati</text><text x="24" y="376" font-size="14" font-weight="400" fill="#161B26" text-anchor="start" opacity="1">Google e i suoi partner possono usare dati</text><text x="24" y="396" font-size="14" font-weight="400" fill="#161B26" text-anchor="start" opacity="1">del tuo dispositivo per mostrarti annunci</text><text x="24" y="416" font-size="14" font-weight="400" fill="#161B26" text-anchor="start" opacity="1">e misurarne i risultati.</text><text x="24" y="452" font-size="13" font-weight="400" fill="#5F6B80" text-anchor="start" opacity="1">Testo e opzioni sono forniti da Google.</text><rect x="24" y="488" width="342" height="52" rx="26" fill="#FFFFFF" stroke="#D5DBE7" stroke-width="1" opacity="1"/><text x="195" y="520" font-size="15.5" font-weight="600" fill="#1F5FD6" text-anchor="middle" opacity="1">Gestisci opzioni</text><rect x="24" y="556" width="342" height="52" rx="26" fill="#1F5FD6" opacity="1"/><text x="195" y="588" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" opacity="1">Acconsento</text><rect x="24" y="624" width="342" height="52" rx="26" fill="#FFFFFF" stroke="#D5DBE7" stroke-width="1" opacity="1"/><text x="195" y="656" font-size="15.5" font-weight="600" fill="#1F5FD6" text-anchor="middle" opacity="1">Non acconsento</text><text x="195" y="712" font-size="12.5" font-weight="400" fill="#5F6B80" text-anchor="middle" opacity="1">Puoi cambiare scelta dalle Impostazioni di FacileCards.</text><text x="24" y="31" font-size="15" font-weight="600" fill="#161B26" text-anchor="start" opacity="1">9:41</text><g fill="#161B26"><rect x="318" y="20" width="3" height="5" rx="1"/><rect x="323" y="17" width="3" height="8" rx="1"/><rect x="328" y="14" width="3" height="11" rx="1"/><rect x="342" y="15" width="22" height="11" rx="3" fill="none" stroke="#161B26" stroke-width="1.4"/><rect x="344" y="17" width="15" height="7" rx="1.5"/></g><rect x="128" y="828" width="134" height="5" rx="2.5" fill="#161B26" opacity="0.55"/></g><rect x=".5" y=".5" width="389" height="843" rx="38" fill="none" stroke="#C3CAD8"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>