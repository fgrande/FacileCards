"5" fill="#B26A00"/><text x="48" y="397" font-size="15.5" font-weight="600" fill="#161B26" text-anchor="start" opacity="1">Chi lo apre può usare le tessere</text><text x="48" y="418" font-size="13.5" font-weight="400" fill="#5F6B80" text-anchor="start" opacity="1">Alla cassa valgono come le tue.</text><circle cx="28" cy="458" r="5" fill="#B26A00"/><text x="48" y="463" font-size="15.5" font-weight="600" fill="#161B26" text-anchor="start" opacity="1">Conservalo in un posto sicuro</text><text x="48" y="484" font-size="13.5" font-weight="400" fill="#5F6B80" text-anchor="start" opacity="1">Un archivio personale, non una chat.</text><circle cx="28" cy="524" r="5" fill="#B26A00"/><text x="48" y="529" font-size="15.5" font-weight="600" fill="#161B26" text-anchor="start" opacity="1">Puoi proteggerlo con una password</text><text x="48" y="550" font-size="13.5" font-weight="400" fill="#5F6B80" text-anchor="start" opacity="1">Al prossimo passaggio, se vuoi.</text><rect x="16" y="694" width="358" height="50" rx="25.0" fill="#1F5FD6" opacity="1"/><text x="195.0" y="724.5" font-size="15.5" font-weight="600" fill="#fff" text-anchor="middle" opacity="1">Continua</text><text x="195" y="790" font-size="15" font-weight="600" fill="#1F5FD6" text-anchor="middle" opacity="1">Annulla</text><text x="24" y="31" font-size="15" font-weight="600" fill="#161B26" text-anchor="start" opacity="1">9:41</text><g fill="#161B26"><rect x="318" y="20" width="3" height="5" rx="1"/><rect x="323" y="17" width="3" height="8" rx="1"/><rect x="328" y="14" width="3" height="11" rx="1"/><rect x="342" y="15" width="22" height="11" rx="3" fill="none" stroke="#161B26" stroke-width="1.4"/><rect x="344" y="17" width="15" height="7" rx="1.5"/></g><rect x="128" y="828" width="134" height="5" rx="2.5" fill="#161B26" opacity="0.55"/></g><rect x=".5" y=".5" width="389" height="843" rx="38" fill="none" stroke="#C3CAD8"/><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>